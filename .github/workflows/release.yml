name: Release bundle

# Does what scripts/release/release.ps1 does, minus the two steps that need a TikTok APK and an
# Android device: bumps the version, cuts the changelog, regenerates the release files, runs the
# tests and lint, builds and signs patches-<version>.mpp, checks the bundle, publishes a GitHub
# release (as a draft first, checked against the hosted files), and refreshes patches-bundle.json.
#
# Not covered here, because a hosted runner has neither: "apply" (every patch applied to a real
# TikTok APK with morphe-desktop) and "walk" (the patched app run through every screen on a
# device). Run those on your own machine before you trust a bundle on your phone.
#
# Run it from the Actions tab (Run workflow) on the default branch and pick the bump:
#   minor (default)  0.81.0 -> 0.82.0
#   patch            0.81.0 -> 0.81.1
#   major            0.81.0 -> 1.0.0
#   none             release the version already in gradle.properties
#
# CHANGELOG.md needs entries under "## Unreleased": the cut turns them into the new version's
# section. Nothing is pushed until the tests and the build have passed, so a failed run leaves
# the repository as it was.
#
# One-time setup, repository secret MORPHE_SIGNING_KEY: the Base64 private key whose public half
# is in morphe-signing.pub. Optional secret GPR_TOKEN: a personal access token with
# read:packages, only needed if GitHub Packages refuses the built-in token.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to bump the version
        type: choice
        options: [minor, patch, major, none]
        default: minor

permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The runner image already has the Android SDK. android-actions/setup-android fails on it
      # ("Failed to find package 'tools'"), so use the preinstalled one and accept its licenses.
      - name: Prepare the Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)
          if [ -z "$SDKM" ]; then
            echo "::error::No sdkmanager under $SDK/cmdline-tools."; ls -la "$SDK"; exit 1
          fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-35" || echo "::warning::Couldn't pre-install platform 35; Gradle will try."
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the branch and signing key
        env:
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Run this on the default branch (${{ github.event.repository.default_branch }}), not $GITHUB_REF_NAME."; exit 1
          fi
          if [ -z "${MORPHE_SIGNING_KEY:-}" ]; then
            echo "::error::Add the repository secret MORPHE_SIGNING_KEY (Settings > Secrets and variables > Actions)."; exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization as s
          try:
              key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["MORPHE_SIGNING_KEY"].strip()))
          except Exception:
              print("::error::MORPHE_SIGNING_KEY isn't a Base64 raw Ed25519 private key.")
              sys.exit(1)
          derived = base64.b64encode(key.public_key().public_bytes(s.Encoding.Raw, s.PublicFormat.Raw)).decode()
          published = open("morphe-signing.pub").read().strip()
          if derived != published:
              print("::error::MORPHE_SIGNING_KEY doesn't match morphe-signing.pub. Commit your own public key first.")
              sys.exit(1)
          PY

      - name: Bump the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys
          text = open("gradle.properties", encoding="utf-8", newline="").read()
          m = re.search(r"(?m)^version[ \t]*=[ \t]*(\d+)\.(\d+)\.(\d+)[ \t]*\r?$", text)
          if not m:
              print("::error::gradle.properties needs a version line like: version = 0.81.0"); sys.exit(1)
          major, minor, patch = (int(part) for part in m.groups())
          old = f"{major}.{minor}.{patch}"
          bump = os.environ.get("BUMP") or "minor"
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          elif bump != "none":
              print(f"::error::Unknown bump {bump}."); sys.exit(1)
          new = f"{major}.{minor}.{patch}"
          tags = subprocess.run(["git", "ls-remote", "--tags", "origin", f"refs/tags/v{new}"],
                                capture_output=True, text=True, check=True).stdout.strip()
          if tags:
              print(f"::error::The tag v{new} already exists. Pick a bigger bump."); sys.exit(1)
          if new != old:
              eol = "\r" if m.group(0).endswith("\r") else ""
              text = text[:m.start()] + f"version = {new}{eol}" + text[m.end():]
              open("gradle.properties", "w", encoding="utf-8", newline="").write(text)
              readme = open("README.md", encoding="utf-8", newline="").read()
              readme = re.sub(r"(badge/version-)\d+\.\d+\.\d+(-)", lambda mo: mo.group(1) + new + mo.group(2), readme)
              open("README.md", "w", encoding="utf-8", newline="").write(readme)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"OLD_VERSION={old}\nVERSION={new}\n")
          print(f"Version {old} -> {new}")
          PY

      # gradle/verification-metadata.xml was generated on Windows and macOS, so it has no checksum
      # for the Linux aapt2 jar and Gradle refuses to use it on this runner. Fetch that one jar
      # from Google's Maven repository, cross-check it against Google's published SHA-1 when the
      # repository serves one, and add its SHA-256 for this run. Every other dependency stays
      # fully verified. The edit is never committed.
      - name: Add the Linux aapt2 checksum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, re, sys, urllib.request
          path = "gradle/verification-metadata.xml"
          xml = open(path, encoding="utf-8", newline="").read()
          m = re.search(r'<component group="com\.android\.tools\.build" name="aapt2" version="([^"]+)">', xml)
          if not m:
              print("::error::No aapt2 component in gradle/verification-metadata.xml."); sys.exit(1)
          version = m.group(1)
          name = f"aapt2-{version}-linux.jar"
          if f'<artifact name="{name}">' in xml:
              print(f"{name} is already listed."); sys.exit(0)
          url = f"https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/{version}/{name}"
          data = urllib.request.urlopen(url, timeout=180).read()
          digest = hashlib.sha256(data).hexdigest()
          try:
              published = urllib.request.urlopen(url + ".sha1", timeout=60).read().decode().split()[0].lower()
              if hashlib.sha1(data).hexdigest() != published:
                  print("::error::The downloaded aapt2 jar doesn't match Google's published SHA-1."); sys.exit(1)
              print("Matches Google's published SHA-1.")
          except Exception as problem:
              print(f"::warning::No published SHA-1 to cross-check ({problem}).")
          marker = f'<artifact name="aapt2-{version}-osx.jar">'
          if marker not in xml:
              print("::error::Couldn't find where to add the Linux checksum."); sys.exit(1)
          entry = (f'<artifact name="{name}">\n            <sha256 value="{digest}" '
                   f'origin="Fetched from Google Maven by the release workflow"/>\n         </artifact>\n         ')
          open(path, "w", encoding="utf-8", newline="").write(xml.replace(marker, entry + marker, 1))
          print(f"Added {name} {digest}")
          PY

      - name: Cut the changelog
        run: |
          set -euo pipefail
          # release.ps1's cut: the Unreleased entries become this version's section.
          if grep -Eq "^## ${VERSION//./\\.} \\(" CHANGELOG.md; then
            echo "CHANGELOG.md already has $VERSION."
          else
            python3 tools/release_text.py cut --version "$VERSION"
          fi

      # gradle/verification-metadata.xml was made on Windows and macOS and lacks some checksums
      # (a few Maven POMs, the Linux aapt2). The two Gradle runs below run in write mode, which adds
      # a checksum for anything unlisted and leaves the rest alone; the step after the build then
      # fails the run if any checksum that was already listed changed or disappeared.
      # The build checks patches-list.json against the version, so it is regenerated for the new
      # one and committed with the bump before the build, which leaves the source it records clean.
      - name: Update the patch list and release files
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 --no-configuration-cache :patches:generatePatchesList --no-daemon --stacktrace
          # The rest of release.ps1's cut: the guide, and the What's new data the app embeds.
          python3 tools/release_text.py guide
          python3 tools/gen-release-notes.py
          # The generated translation classes have to match the tables, or the app shows stale text.
          python3 scripts/gen-l10n.py
          GENERATED='extensions/tiktok/src/main/java/app/morphe/extension/tiktok/settings/L10nTranslations*.java extensions/tiktok/src/main/l10n/en.csv'
          # shellcheck disable=SC2086
          if ! git diff --quiet -- $GENERATED; then
            git status --short -- $GENERATED
            echo "::error::The translation tables and the generated classes disagree. Run python scripts/gen-l10n.py and commit the result."
            exit 1
          fi

      - name: Commit the version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Files .gitignore covers (local.properties, build folders) are skipped on their own.
          git add -A
          # The checksum additions are for this run only, and Python's caches aren't part of a release.
          git reset -q -- gradle/verification-metadata.xml
          git diff --cached --name-only | grep -E '(^|/)__pycache__/' | xargs -r git reset -q -- || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(release): prepare $VERSION for publication [skip ci]"
          fi

      - name: Run the tests and lint
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # The same tasks release.ps1's test step runs.
          ./gradlew --write-verification-metadata sha256 --no-configuration-cache --continue \
            :extensions:tiktok:test :patches:test :extensions:shared:library:lint :extensions:tiktok:lint \
            --no-daemon --stacktrace

      - name: Build and sign the bundle
        env:
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 --no-configuration-cache :patches:buildAndroid --no-daemon --stacktrace

      - name: Verify the bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, zipfile
          path = f"patches/build/release/patches-{os.environ['VERSION']}.mpp"
          with zipfile.ZipFile(path) as bundle:
              if "classes.dex" not in bundle.namelist():
                  print("::error::The bundle has no classes.dex, so Manager would load no patches."); sys.exit(1)
              comment = bundle.comment.decode("ascii", "replace")
          match = re.fullmatch(r"MorpheSig1 ([A-Za-z0-9+/]{43}=) ([A-Za-z0-9+/]{86}==)", comment)
          if not match:
              print("::error::The bundle has no MorpheSig1 signature."); sys.exit(1)
          published = open("morphe-signing.pub").read().strip()
          # Manager pins the first key a source signs with and refuses any other.
          if match.group(1) != published:
              print("::error::The bundle isn't signed by morphe-signing.pub."); sys.exit(1)
          print("classes.dex is there, and the signature is from morphe-signing.pub.")
          PY

      - name: Check the checksum file only grew
        run: |
          set -euo pipefail
          git show HEAD:gradle/verification-metadata.xml > "$RUNNER_TEMP/verification-before.xml"
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          def load(path):
              found = {}
              for component in ET.parse(path).getroot().iter():
                  if component.tag.split("}")[-1] != "component":
                      continue
                  for artifact in component:
                      if artifact.tag.split("}")[-1] != "artifact":
                          continue
                      key = (component.get("group"), component.get("name"), component.get("version"), artifact.get("name"))
                      values = found.setdefault(key, set())
                      for checksum in artifact:
                          kind = checksum.tag.split("}")[-1]
                          if kind in ("md5", "sha1", "sha256", "sha512"):
                              values.add((kind, checksum.get("value")))
              return found

          before = load(os.path.join(os.environ["RUNNER_TEMP"], "verification-before.xml"))
          after = load("gradle/verification-metadata.xml")
          lost = [key for key, values in before.items() if not values <= after.get(key, set())]
          added = [key for key in after if key not in before]
          print(f"{len(added)} checksums added by Gradle, {len(before)} already listed.")
          for key in added:
              print("  added:", ":".join(str(part) for part in key))
          if lost:
              for key in lost:
                  print("::error::A listed checksum changed or went missing:", ":".join(str(part) for part in key))
              sys.exit(1)
          PY

      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd patches/build/release
          BUNDLE="patches-$VERSION.mpp"
          test -f "$BUNDLE" || { echo "::error::$BUNDLE wasn't built."; ls -la; exit 1; }
          HASH=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          if [ "$HASH" != "$(tr -d '[:space:]' < bundle.sha256)" ]; then
            echo "::error::The bundle's hash differs from the one the build recorded."; exit 1
          fi
          printf '%s  %s\n' "$HASH" "$BUNDLE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          DEFAULT="${{ github.event.repository.default_branch }}"
          # The tests and the build passed, so the prepared commit goes to the default branch now.
          git push origin "HEAD:$DEFAULT"
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_TAG=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG" ] && [ "$REMOTE_TAG" != "$HEAD_SHA" ]; then
            echo "::error::$TAG on GitHub is $REMOTE_TAG, not $HEAD_SHA."; exit 1
          fi
          if [ -z "$REMOTE_TAG" ]; then
            git tag "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/$TAG"
          fi
          # The notes: what this run checked, then the changelog's section for this version.
          python3 - <<'PY' > "$RUNNER_TEMP/notes.md"
          import os, re
          version = os.environ["VERSION"]
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          found = re.search(rf"^## {re.escape(version)} \(.*?\)\n(.*?)(?=^## |\Z)", changelog, re.S | re.M)
          print(f"Built by GitHub Actions from {os.environ['GITHUB_SHA'][:7]}.")
          print()
          print("What was checked:")
          print()
          print("* The unit tests and lint passed.")
          print("* The bundle has its classes.dex and is signed by this source's key.")
          print("* The files below are the ones that were uploaded, hash for hash.")
          print("* Not checked here: the patches applied to a real TikTok APK, or the patched app run on a device.")
          print()
          print(found.group(1).strip() if found else "")
          PY
          cd patches/build/release
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$TAG is already public."; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "patches-$VERSION.mpp" SHA256SUMS.txt --clobber
          # Download them back and compare, and only then make the release public.
          mkdir -p "$RUNNER_TEMP/downloaded"
          gh release download "$TAG" --dir "$RUNNER_TEMP/downloaded" --clobber
          for file in "patches-$VERSION.mpp" SHA256SUMS.txt; do
            if [ "$(sha256sum "$file" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/downloaded/$file" | cut -d' ' -f1)" ]; then
              echo "::error::The hosted $file isn't the file that was uploaded. $TAG is still a draft."; exit 1
            fi
          done
          gh release edit "$TAG" --draft=false --latest
          echo "$TAG is public."

      - name: Refresh patches-bundle.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEFAULT="${{ github.event.repository.default_branch }}"
          # The aapt2 and other checksum additions were for this run only.
          git checkout -- gradle/verification-metadata.xml
          COUNT=$(jq '(.patches // .) | length' patches-list.json)
          jq --arg v "$VERSION" --argjson n "$COUNT" \
             --arg d "$(date -u +%Y-%m-%dT%H:%M:%S)" \
             --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/patches-$VERSION.mpp" \
             --arg k "$(tr -d '[:space:]' < morphe-signing.pub)" \
             '.version=$v | .created_at=$d | .download_url=$u | .public_key=$k
              | .description |= (sub("Larpfeed v[0-9]+\\.[0-9]+\\.[0-9]+"; "Larpfeed v" + $v) | sub("[0-9]+ patches"; "\($n) patches"))' \
             patches-bundle.json > "$RUNNER_TEMP/patches-bundle.json"
          cp "$RUNNER_TEMP/patches-bundle.json" patches-bundle.json
          if git diff --quiet -- patches-bundle.json; then
            echo "patches-bundle.json is already current."
          else
            git add patches-bundle.json
            git commit -m "chore(release): point Manager to the verified $VERSION bundle [skip ci]"
            git push origin "HEAD:$DEFAULT" || {
              echo "::error::Couldn't push to $DEFAULT (branch protection?). patches-bundle.json has to be updated by hand:"
              cat patches-bundle.json
              exit 1
            }
          fi
          # What Manager reads is what GitHub hosts, so check that and not the local copy.
          HOSTED=$(gh api "repos/$GITHUB_REPOSITORY/contents/patches-bundle.json?ref=$DEFAULT" -H 'Accept: application/vnd.github.raw' | jq -r .version)
          if [ "$HOSTED" != "$VERSION" ]; then
            echo "::error::GitHub's patches-bundle.json reads $HOSTED, not $VERSION."; exit 1
          fi
          echo "patches-bundle.json on $DEFAULT reads $VERSION."

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
