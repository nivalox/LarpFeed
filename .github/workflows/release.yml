name: Release bundle

# Bumps the version, builds and signs patches-<version>.mpp, writes SHA256SUMS.txt, tags and
# publishes a GitHub release, and refreshes patches-bundle.json (the file Morphe Manager reads).
#
# Run it from the Actions tab (Run workflow) on the default branch and pick the bump:
#   minor (default)  0.81.0 -> 0.82.0
#   patch            0.81.0 -> 0.81.1
#   major            0.81.0 -> 1.0.0
#   none             release the version already in gradle.properties
#
# The bump is committed to the default branch only after the build has passed, so a failed
# run leaves the repository as it was.
#
# One-time setup, repository secret MORPHE_SIGNING_KEY: the Base64 private key whose public half
# is in morphe-signing.pub. Optional secret GPR_TOKEN: a personal access token with
# read:packages, only needed if GitHub Packages refuses the built-in token.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to bump the version
        type: choice
        options: [minor, patch, major, none]
        default: minor

permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already has the Android SDK. android-actions/setup-android fails on it
      # ("Failed to find package 'tools'"), so use the preinstalled one and accept its licenses.
      - name: Prepare the Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)
          if [ -z "$SDKM" ]; then
            echo "::error::No sdkmanager under $SDK/cmdline-tools."; ls -la "$SDK"; exit 1
          fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-35" || echo "::warning::Couldn't pre-install platform 35; Gradle will try."
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the branch and signing key
        env:
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Run this on the default branch (${{ github.event.repository.default_branch }}), not $GITHUB_REF_NAME."; exit 1
          fi
          if [ -z "${MORPHE_SIGNING_KEY:-}" ]; then
            echo "::error::Add the repository secret MORPHE_SIGNING_KEY (Settings > Secrets and variables > Actions)."; exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization as s
          try:
              key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["MORPHE_SIGNING_KEY"].strip()))
          except Exception:
              print("::error::MORPHE_SIGNING_KEY isn't a Base64 raw Ed25519 private key.")
              sys.exit(1)
          derived = base64.b64encode(key.public_key().public_bytes(s.Encoding.Raw, s.PublicFormat.Raw)).decode()
          published = open("morphe-signing.pub").read().strip()
          if derived != published:
              print("::error::MORPHE_SIGNING_KEY doesn't match morphe-signing.pub. Commit your own public key first.")
              sys.exit(1)
          PY

      - name: Bump the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys
          text = open("gradle.properties", encoding="utf-8", newline="").read()
          m = re.search(r"(?m)^version[ \t]*=[ \t]*(\d+)\.(\d+)\.(\d+)[ \t]*\r?$", text)
          if not m:
              print("::error::gradle.properties needs a version line like: version = 0.81.0"); sys.exit(1)
          major, minor, patch = (int(part) for part in m.groups())
          old = f"{major}.{minor}.{patch}"
          bump = os.environ.get("BUMP") or "minor"
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          elif bump != "none":
              print(f"::error::Unknown bump {bump}."); sys.exit(1)
          new = f"{major}.{minor}.{patch}"
          tags = subprocess.run(["git", "ls-remote", "--tags", "origin", f"refs/tags/v{new}"],
                                capture_output=True, text=True, check=True).stdout.strip()
          if tags:
              print(f"::error::The tag v{new} already exists. Pick a bigger bump."); sys.exit(1)
          if new != old:
              eol = "\r" if m.group(0).endswith("\r") else ""
              text = text[:m.start()] + f"version = {new}{eol}" + text[m.end():]
              open("gradle.properties", "w", encoding="utf-8", newline="").write(text)
              readme = open("README.md", encoding="utf-8", newline="").read()
              readme = re.sub(r"(badge/version-)\d+\.\d+\.\d+(-)", lambda mo: mo.group(1) + new + mo.group(2), readme)
              open("README.md", "w", encoding="utf-8", newline="").write(readme)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"OLD_VERSION={old}\nVERSION={new}\n")
          print(f"Version {old} -> {new}")
          PY

      # gradle/verification-metadata.xml was generated on Windows and macOS, so it has no checksum
      # for the Linux aapt2 jar and Gradle refuses to use it on this runner. Fetch that one jar
      # from Google's Maven repository, cross-check it against Google's published SHA-1 when the
      # repository serves one, and add its SHA-256 for this run. Every other dependency stays
      # fully verified. The edit is never committed.
      - name: Add the Linux aapt2 checksum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, re, sys, urllib.request
          path = "gradle/verification-metadata.xml"
          xml = open(path, encoding="utf-8", newline="").read()
          m = re.search(r'<component group="com\.android\.tools\.build" name="aapt2" version="([^"]+)">', xml)
          if not m:
              print("::error::No aapt2 component in gradle/verification-metadata.xml."); sys.exit(1)
          version = m.group(1)
          name = f"aapt2-{version}-linux.jar"
          if f'<artifact name="{name}">' in xml:
              print(f"{name} is already listed."); sys.exit(0)
          url = f"https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/{version}/{name}"
          data = urllib.request.urlopen(url, timeout=180).read()
          digest = hashlib.sha256(data).hexdigest()
          try:
              published = urllib.request.urlopen(url + ".sha1", timeout=60).read().decode().split()[0].lower()
              if hashlib.sha1(data).hexdigest() != published:
                  print("::error::The downloaded aapt2 jar doesn't match Google's published SHA-1."); sys.exit(1)
              print("Matches Google's published SHA-1.")
          except Exception as problem:
              print(f"::warning::No published SHA-1 to cross-check ({problem}).")
          marker = f'<artifact name="aapt2-{version}-osx.jar">'
          if marker not in xml:
              print("::error::Couldn't find where to add the Linux checksum."); sys.exit(1)
          entry = (f'<artifact name="{name}">\n            <sha256 value="{digest}" '
                   f'origin="Fetched from Google Maven by the release workflow"/>\n         </artifact>\n         ')
          open(path, "w", encoding="utf-8", newline="").write(xml.replace(marker, entry + marker, 1))
          print(f"Added {name} {digest}")
          PY

      # The build checks patches-list.json against the version, so it is regenerated for the new
      # one and committed with the bump before the build, which leaves the source it records clean.
      - name: Update the patch list
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList --no-daemon --stacktrace

      - name: Commit the version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties patches-list.json README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(release): v$VERSION [skip ci]"
          fi

      - name: Build and sign the bundle
        env:
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd patches/build/release
          BUNDLE="patches-$VERSION.mpp"
          test -f "$BUNDLE" || { echo "::error::$BUNDLE wasn't built."; ls -la; exit 1; }
          HASH=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          if [ "$HASH" != "$(tr -d '[:space:]' < bundle.sha256)" ]; then
            echo "::error::The bundle's hash differs from the one the build recorded."; exit 1
          fi
          printf '%s  %s\n' "$HASH" "$BUNDLE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # The build passed, so the bump goes to the default branch now and the tag points at it.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          SHA=$(git rev-parse HEAD)
          cd patches/build/release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "patches-$VERSION.mpp" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "patches-$VERSION.mpp" SHA256SUMS.txt \
              --target "$SHA" --title "$TAG" --generate-notes
          fi

      - name: Refresh patches-bundle.json
        run: |
          set -euo pipefail
          DEFAULT="${{ github.event.repository.default_branch }}"
          # The aapt2 checksum edit was for this run only.
          git checkout -- gradle/verification-metadata.xml
          jq --arg v "$VERSION" \
             --arg d "$(date -u +%Y-%m-%dT%H:%M:%S)" \
             --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/patches-$VERSION.mpp" \
             --arg k "$(tr -d '[:space:]' < morphe-signing.pub)" \
             '.version=$v | .created_at=$d | .download_url=$u | .public_key=$k
              | .description |= sub("Larpfeed v[0-9]+\\.[0-9]+\\.[0-9]+"; "Larpfeed v" + $v)' \
             patches-bundle.json > /tmp/patches-bundle.json
          cp /tmp/patches-bundle.json patches-bundle.json
          if git diff --quiet -- patches-bundle.json; then
            echo "patches-bundle.json is already current."
          else
            git add patches-bundle.json
            git commit -m "chore(release): point patches-bundle.json at v$VERSION [skip ci]"
            git push origin "HEAD:$DEFAULT" || {
              echo "::warning::Couldn't push to $DEFAULT (branch protection?). Update patches-bundle.json by hand:"
              cat patches-bundle.json
            }
          fi
